<!DOCTYPE html>
<html>
<head>
    <title>Moving Ball Animation</title>
    <style>
        #container {
            width: 600px;
            height: 150px;
            border: 2px solid black;
            position: relative;
            margin: 50px auto;
        }

        #ball {
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            left: 0;
            top: 50px;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Moving Ball Animation</h2>

    <div id="container">
        <div id="ball"></div>
    </div>

    <button onclick="startAnimation()">Start Animation</button>

    <script>
        function startAnimation() {
            let ball = document.getElementById("ball");
            let position = 0;

            let animation = setInterval(function() {
                position += 5;
                ball.style.left = position + "px";

                if (position >= 500) {
                    clearInterval(animation);
                }
            }, 50);
        }
    </script>

</body>
</html>
